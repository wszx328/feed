<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>饲</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <!-- 主菜单 -->
  <div id="menu-view" class="view active">
    <div class="menu-container">
      <div class="menu-decoration">
        <div class="cat-face" id="cat-face">
          <div class="cat-ear left"></div>
          <div class="cat-ear right"></div>
          <div class="cat-eye left"></div>
          <div class="cat-eye right"></div>
          <div class="cat-nose"></div>
        </div>
      </div>
      <h1 class="game-title">饲</h1>
      <div class="menu-info">
        <span class="info-item">总积分：<span id="menu-total-score">0</span></span>
        <span class="info-item">游玩次数：<span id="menu-play-count">0</span></span>
      </div>
      <div class="menu-buttons">
        <button id="btn-start" class="btn btn-primary">开始新游戏</button>
        <button id="btn-shop" class="btn btn-secondary">进入商店</button>
        <button id="btn-gallery" class="btn btn-secondary">查看结局图鉴</button>
      </div>
      <p class="menu-hint">ROOM酒店系列 · 后传</p>
    </div>
  </div>

  <!-- 开场动画 -->
  <div id="intro-view" class="view">
    <div class="intro-overlay">
      <div id="intro-paper" class="intro-paper">
        <p id="intro-paper-text"></p>
        <p class="intro-click-hint">点击纸条</p>
      </div>
      <div id="intro-smoke" class="intro-smoke hidden"></div>
      <div id="intro-eye" class="intro-eye hidden"></div>
    </div>
  </div>

  <!-- 商店 -->
  <div id="shop-view" class="view">
    <div class="shop-container">
      <h2 class="shop-title">商店</h2>
      <p class="shop-score">当前积分：<span id="shop-score-value">0</span></p>
      <div class="shop-grid" id="shop-items"></div>
      <div class="backpack-area">
        <div class="backpack-header">
          <span>背包栏</span>
          <span id="carry-count">0 / 3</span>
        </div>
        <div class="backpack-slots" id="backpack-slots"></div>
        <div class="backpack-actions">
          <button id="btn-clear-carry" class="btn btn-secondary">清除</button>
          <button id="btn-confirm-carry" class="btn btn-primary">确认携带</button>
        </div>
      </div>
      <button id="btn-shop-back" class="btn btn-back">返回主菜单</button>
    </div>
  </div>

  <!-- 游戏 -->
  <div id="game-view" class="view">
    <div class="game-container">
      <div class="game-header">
        <div id="timer-display" class="timer-display">60.0</div>
        <div class="game-status">
          <span id="warning-text" class="warning-text"></span>
        </div>
        <button id="btn-end-game" class="btn btn-danger">结束</button>
      </div>
      <div id="reaction-area" class="reaction-area">
        <p id="reaction-text" class="reaction-text"></p>
      </div>
      <div id="food-options" class="food-options"></div>
      <div class="item-bar">
        <div class="item-bar-header">
          <span>道具栏</span>
          <span id="item-bar-status"></span>
        </div>
        <div id="carried-items" class="carried-items"></div>
      </div>
      <div id="rampage-overlay"></div>
    </div>
  </div>

  <!-- 图鉴 -->
  <div id="gallery-view" class="view">
    <div class="gallery-container">
      <h2 class="gallery-title">结局图鉴</h2>
      <p class="gallery-progress" id="gallery-progress">收集进度：0 / 40</p>
      <div class="gallery-grid" id="gallery-list"></div>
      <button id="btn-gallery-back" class="btn btn-back">返回主菜单</button>
    </div>
  </div>

  <!-- 结算弹窗 -->
  <div id="result-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <h2 id="result-ending-name"></h2>
      <p id="result-ending-text"></p>
      <p id="result-earn-score"></p>
      <button id="btn-result-continue" class="btn btn-primary">返回主菜单</button>
    </div>
  </div>

  <!-- 统计弹窗 -->
  <div id="stats-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <h2>投喂统计</h2>
      <p id="stats-text"></p>
      <button id="btn-stats-confirm" class="btn btn-primary">确定</button>
    </div>
  </div>

  <!-- 结局详情弹窗（图鉴用） -->
  <div id="gallery-detail-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content gallery-detail-content">
      <h2 id="gallery-detail-title"></h2>
      <div id="gallery-detail-text"></div>
      <button id="btn-gallery-detail-close" class="btn btn-primary">关闭</button>
    </div>
  </div>

  <!-- 自定义提示/确认弹窗 -->
  <div id="custom-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content custom-modal-content">
      <p id="custom-modal-text"></p>
      <div class="custom-modal-buttons">
        <button id="btn-custom-modal-ok" class="btn btn-primary">确定</button>
        <button id="btn-custom-modal-cancel" class="btn btn-secondary">取消</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data/texts.js"></script>
  <script src="js/data/foods.js"></script>
  <script src="js/data/items.js"></script>
  <script src="js/data/endings.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/state.js"></script>
  <script src="js/endings-judge.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
